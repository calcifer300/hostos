<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>hostOS Companion</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="app">

    <header>
        <img class="logomark" src="icon48.png" alt="" aria-hidden="true">
        <div class="brand">
            <div class="brand-title">host<span class="brand-os">OS</span></div>
            <div class="brand-sub">Companion</div>
        </div>
        <span id="pairPill" class="pair-pill" title="Pairing status">&nbsp;</span>
    </header>

    <div class="tabs-wrap">
    <nav class="tabs" role="tablist" aria-label="Companion sections">
        <button id="tripsViewBtn" class="view-btn active" role="tab">Operations</button>
        <button id="fleetViewBtn" class="view-btn" role="tab">Vehicles</button>
        <button id="alertsViewBtn" class="view-btn" role="tab">Alerts<span id="alertsTabCount" class="tab-count" hidden></span></button>
        <button id="repliesViewBtn" class="view-btn" role="tab">Replies</button>
        <button id="boardViewBtn" class="view-btn" role="tab">Activity</button>
        <button id="syncViewBtn" class="view-btn" role="tab">Sync</button>
    </nav>
    </div>

    <div class="controls">
        <button id="scanButton">Sync now</button>
        <div id="status"></div>
    </div>

    <div id="output"></div>

    <footer class="credit">
        <span>Companion v3.1</span>
        <a id="openDashboard" href="#">Open dashboard</a>
    </footer>

</div>

<!-- Load order matters: data + pure functions first, then orchestration, then UI -->
<script src="fleet.js"></script>
<script src="fleetStore.js"></script>
<script src="messageLog.js"></script>
<script src="tripWatch.js"></script>
<script src="parser.js"></script>
<script src="matcher.js"></script>
<script src="formatter.js"></script>
<script src="availability.js"></script>
<script src="generator.js"></script>
<script src="replyMatcher.js"></script>
<script src="alerts.js"></script>
<script src="sync.js"></script>
<script src="popup.js"></script>

</body>
</html>
